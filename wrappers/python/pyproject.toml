[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantion"
version = "0.2.1"
description = "Read Ionic (.ion) and mzML files and turn chromatograms into numbers: noise, baseline, peaks, targets and features."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.urls]
Documentation = "https://phenological.github.io/quantion/?language=python"
Repository = "https://github.com/phenological/quantion"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantion*"]

[tool.setuptools.package-data]
quantion = ["native/**/*"]
