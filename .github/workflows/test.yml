name: test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Use the Rust that ships with the runner
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install numpy
        run: python3 -m pip install --upgrade pip numpy

      - name: Install the R packages the wrapper declares
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: wrappers/r

      - name: Build the JS addon
        working-directory: wrappers/js
        run: |
          npm install --ignore-scripts
          npx node-gyp rebuild
          npm run tsc-cjs

      - name: The 5 version numbers agree
        run: make check-version

      - name: The committed headers match a fresh build
        run: make header-check

      - name: The Rust tests pass
        run: make test

      - name: Build the native library
        run: make native

      - name: The Python tests pass, none skipped
        env:
          QUANTION_ARTIFACTS_ROOT: ${{ github.workspace }}/artifacts
        run: |
          python3 -m unittest discover -s wrappers/python/tests -t wrappers/python 2>&1 | tee python-tests.log
          if grep -q "skipped=" python-tests.log; then
            echo "Python tests were skipped: the library or a fixture was not found"
            exit 1
          fi

      - name: Rust, R, Python and JS return the same numbers
        run: make check-api

      - uses: r-lib/actions/setup-pandoc@v2
        if: runner.os == 'Linux'

      - name: The CRAN package passes R CMD check --as-cran
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y devscripts
          scripts/build-r-package.sh dist/r

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the wasm artifact
        run: make wasm LLVM_PREFIX=/usr/lib/llvm-18

      - name: The JS wrapper builds and its tests pass
        working-directory: wrappers/js
        run: |
          npm install --ignore-scripts
          npx node-gyp rebuild
          npm run tsc-cjs
          npm run build
          npx jest
